name: sandana_track_flow
description: SandanaTrackFlow - Document Management App

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # File Picker
  file_picker: ^8.0.0

  # Image Picker
  image_picker: ^1.0.7

  # Signature Pad (untuk TTD)
  syncfusion_flutter_signaturepad: ^33.2.7

    # PDF Viewer (untuk preview dokumen di document_detail_page)
  syncfusion_flutter_pdfviewer: ^33.2.7

  # Charts (donut chart)
  fl_chart: ^1.2.0

  # Shared Preferences (session)
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.2

  # Crypto (hash password)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/